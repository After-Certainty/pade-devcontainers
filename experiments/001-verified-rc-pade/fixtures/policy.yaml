apiVersion: rc-pade.local/v1alpha1
kind: ProjectionPolicy
rules:
  - match:
      kind: api
      interfaceType: http
    outsidePADE: true
  - match:
      kind: google.analytics
      interfaceType: web
    outsidePADE: true
  - match:
      kind: source_control
      interfaceType: git
    require:
      - path: interface.provider
        equals: github
    project:
      - when:
          - path: interface.access
            contains: fetch
        capability: github.repo.read
        access: read
      - when:
          - path: interface.access
            contains: pull
        capability: github.repo.read
        access: read
      - when:
          - path: interface.access
            contains: push
        capability: github.repo.write
        access: write
      - when:
          - path: interface.access
            contains: clone
        capability: github.repo.read
        access: read
    cover:
      - interface.access
